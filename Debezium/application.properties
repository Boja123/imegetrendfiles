# Drop large binary (varbinary) columns from the CDC change events. These BLOBs
# (compressed/uncompressed file blobs, waveform graphics, signature image) can push a
# single Event Hub message past the 1 MB limit, which drops the WHOLE row payload.
# Excluding the binary column keeps the rest of the row flowing. None are primary keys.
# Format: <schema>\.<table>\.<column> (regex; dots escaped, same style as table.include.list).
debezium.source.column.exclude.list=EmsEvent\.IncidentFileAttachment\.DocumentFileCompressed,EmsEvent\.IncidentFileAttachment\.DocumentFileUncompressed,ImportExport\.ExportHistory\.ExportFileCompressed,ImportExport\.ImportHistory\.ImportFileCompressed,EmsEvent\.MedicalDeviceWaveform\.WaveformGraphicUncompressed,EmsEvent\.MedicalDeviceWaveform\.WaveformGraphicCompressed,EmsEvent\.Signature\.Image,EmsEvent\.VitalsWaveform\.WaveformGraphicUncompressed,EmsEvent\.VitalsWaveform\.WaveformGraphicCompressed,FireEvent\.IncidentFileAddendum\.DocumentFileUncompressed,FireInvestigation\.IncidentFileAttachment\.DocumentFileUncompressed

debezium.source.database.encrypt=true
debezium.source.database.trustServerCertificate=true

debezium.source.max.queue.size=8192
debezium.source.max.batch.size=1024
debezium.source.poll.interval.ms=1000
debezium.source.snapshot.mode=no_data
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
debezium.source.schema.history.internal.store.only.captured.tables.ddl=true

debezium.source.heartbeat.interval.ms=30000
debezium.source.heartbeat.topics.prefix=__debezium-heartbeat

# =========================
# OFFSETS + HISTORY (Docker paths)
# =========================
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=60000

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema_history.dat

# =========================
# TRANSFORMS
# =========================
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
# debezium.transforms.unwrap.drop.tombstones=false  # removed in Debezium 3.2
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.add.headers=op,source.ts_ms,source.db,source.schema,source.table,source.commit_lsn
# add.fields puts the routing metadata in the message BODY (__op/__source_table/__source_db/__source_schema/
# __source_ts_ms/__source_commit_lsn). add.headers alone was not surfacing on the Event Hub Kafka interface, so
# downstream consumers had no table identifier to route on. Required by cdc/eventhub_to_bronze_stream.
debezium.transforms.unwrap.add.fields=op,source.table,source.db,source.schema,source.ts_ms,source.commit_lsn

# =========================
# SINK - Azure Event Hubs
# =========================
debezium.sink.type=eventhubs
debezium.sink.eventhubs.connectionstring=${EVENTHUB_CONNECTION_STRING}
debezium.sink.eventhubs.hubname=debezium-cdc
debezium.sink.eventhubs.linger.ms=0
debezium.sink.eventhubs.batch.size=1000
debezium.sink.eventhubs.producer.retries=1000
debezium.sink.eventhubs.connection.idle.timeout.ms=300000
